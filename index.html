<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>老弟の神秘错题本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="plate">
    <span class="drawer">合集</span>
    <h1>错题本</h1>
    <p>快把错题放进来.</p>
    <div class="sync-row">
      <span id="syncStatus" class="sync-status">Not connected</span>
      <button class="ghost small" id="settingsToggle">GitHub sync</button>
    </div>
  </div>

  <div class="glass settings" id="settingsPanel" hidden>
    <p class="slip-label">Connect a GitHub repo</p>
    <p class="hint">Needs a token with repo contents access. Stored only in this browser's localStorage and sent directly to GitHub — never share this page's source with anyone you don't trust with that token.</p>
    <div class="row">
      <input id="ghOwner" placeholder="Repo owner (username)">
      <input id="ghRepo" placeholder="Repo name">
    </div>
    <div class="row">
      <input id="ghPath" placeholder="File path (mistakes.md)">
      <input id="ghBranch" placeholder="Branch (main)">
    </div>
    <input id="ghToken" type="password" placeholder="Personal access token" style="margin-bottom:12px">
    <div class="actions">
      <button class="primary" id="ghConnect">Save & sync</button>
    </div>
  </div>

  <div class="slip glass">
    <p class="slip-label">新题</p>
    <div class="row">
      <input id="subject" placeholder="Subject" maxlength="40">
      <input id="title" placeholder="Question title" maxlength="80">
    </div>
    <textarea id="question" placeholder="What did you get wrong?"></textarea>
    <textarea id="answer" placeholder="Correct answer or lesson learned..."></textarea>
    <div class="actions">
      <button class="primary" id="add">记录</button>
      <button class="ghost" id="print">打印/保存</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <p class="count" id="count"></p>
  <section id="list" aria-live="polite"></section>
</div>

<script src="script.js"></script>
</body>
</html>
